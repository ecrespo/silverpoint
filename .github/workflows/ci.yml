name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  # The release workflow runs this whole pipeline first (Art. 3: CI blocks the release).
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # REQ-004, REQ-027, REQ-106, REQ-161..163, REQ-034 and the spec corpus gate.
      - run: pnpm lint
      # REQ-126, REQ-127: every ink of every ground against every substrate.
      - run: pnpm exec tsx tools/contrast-gate/contrast-gate.ts
      # REQ-044: a PR that touches a ground may not touch the charts.
      # Feature PRs only: a release PR's window legitimately holds many ground and chart changes.
      - if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: node tools/lint-rules/check-ground-pr.mjs origin/${{ github.base_ref }}
      # …and on direct pushes to develop, over the pushed range.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.event.before != '0000000000000000000000000000000000000000'
        run: node tools/lint-rules/check-ground-pr.mjs ${{ github.event.before }}
      # TD §9, REQ-160: a feature PR that touches packages/ carries a changeset. A release PR
      # into main has consumed them with `changeset version`, so it is not checked.
      - if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: node tools/release/check-changeset.mjs origin/${{ github.base_ref }}
      - run: pnpm build
      # Every package's own typecheck, tests and templates included (vue-tsc, ngc).
      - run: pnpm -r run typecheck
      # Browser-free suites here; the gates that launch Chromium run in the pinned image below.
      - run: pnpm exec vitest run --project core --project grounds --project fonts --project tools --project react --project react-18 --project vue --project angular
      # REQ-180: every adapter against the canonical render of every fixture.
      - run: pnpm --filter @silverpoint/visual-gate string-gate
      # REQ-164: every package within its declared budget.
      - run: pnpm exec size-limit
      # REQ-183, REQ-184: every MUST cited by a test, or deferred by the task list.
      - run: pnpm exec tsx tools/traceability/traceability.ts

  # The integration bench and the pixel gate run on one rasteriser, pinned by digest (Art. 3).
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      NG_CLI_ANALYTICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # REQ-033, REQ-034, REQ-100, REQ-105, REQ-107, REQ-164: gates over the published builds.
      - run: pnpm exec vitest run --project gates
      # REQ-103, REQ-109, REQ-042, REQ-032 on the four example apps; REQ-181 pixel gate.
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
