name: mcp-smoke

# REQ-568: once Vercel reports a successful deployment of the MCP project (apps/mcp-vercel), a
# real MCP client initialises against it and calls every tool once. The site's own deployments
# report here too; only the MCP project's environments are smoke-tested.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    # Only Vercel's own deployments; the URL reaches the shell through env, checked, never interpolated.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      contains(github.event.deployment_status.environment, 'mcp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-z0-9.-]+\.vercel\.app/?$ ]] || { echo "not a Vercel deployment URL: $DEPLOYMENT_URL"; exit 1; }
          pnpm --filter @silverpoint/mcp-smoke smoke "${DEPLOYMENT_URL%/}/mcp"
