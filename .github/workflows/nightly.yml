name: nightly

# TD §9 "Performance · Vitest benchmarks · Nightly": geometry for a 100-point chart against the
# 2 ms of TD §2, and the full initial render of a card against its 16 ms. Reported in the job
# summary, never enforced: shared runners are too noisy.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest bench --run packages/core/bench packages/grounds/bench --reporter=default --reporter=json --outputFile.json=bench.json
      - run: pnpm exec tsx tools/bench-report/report.ts bench.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

  # Advisories against what the six packages ship (Phase 0 minor): nightly, not per PR, because
  # the advisory database changes under an unchanged lockfile.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  # Data Model §5, TD §8: the full 1,584-fixture matrix — 33 charts × 2 modes × 4 substrates ×
  # 2 hatchFill × 3 sizes — through the string gate (REQ-180) and the pixel gate (REQ-181), on the
  # same pinned rasteriser as the PR job. The PR runs the md + tile slice only.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      NG_CLI_ANALYTICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      SP_MATRIX: full
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @silverpoint/visual-gate string-gate
      - run: pnpm exec playwright test pixel
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-full-matrix
          path: test-results/

  # PRD §4.2: the site's quickstart, followed literally for React, Vue and Angular — a fresh app,
  # this checkout's packed packages, a build and a first render — in under ten minutes each.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec tsx tools/quickstart/quickstart.ts
