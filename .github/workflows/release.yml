name: release

# Publishes the six packages with the same version, from CI, with no token in the repository:
# npm Trusted Publishing authenticates this workflow through GitHub's OIDC token (TD §9).
# Prerequisites (Implementation Plan §2): the @silverpoint organisation on npm, and each package
# configured on npmjs.com to trust this repository and workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  # Every gate — lint, contrast, string gate, budgets, traceability, the bench and the pixel
  # gate in the pinned image — must pass before anything is published (Art. 3).
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Angular publishes its APF build from dist/ (publishConfig.directory).
      - run: pnpm --filter "./packages/**" publish --access public --provenance --no-git-checks
